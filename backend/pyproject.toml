[project]
name = "personal-finance-autopilot-backend"
version = "0.1.0"
description = "FastAPI backend for Personal Finance Autopilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1.1",
  "openpyxl>=3.1.2",
  "pdfplumber>=0.11.0",
  "PyMuPDF>=1.24.0",
  "rapidfuzz>=3.9.0",
  "psycopg[binary]>=3.1.19"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.4.8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
