services:
  - type: web
    name: personal-finance-autopilot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-finance-autopilot-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://personal-finance-autopilot-web.onrender.com

  - type: web
    name: personal-finance-autopilot-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://personal-finance-autopilot-api.onrender.com/api/v1

databases:
  - name: personal-finance-autopilot-db
    plan: free

